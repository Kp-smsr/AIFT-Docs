site_name: AIFT Documentation
site_description: Documentation for AIFT — Automated Intelligent Functional Testing
site_author: AIFT Team
repo_name: ''
theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'indigo'
  font:
    text: Roboto
  language: en
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.extra
  - pymdownx.betterem:
      smart_enable: all
nav:
  - Home: index.md
  - Overview: overview.md
  - Definitions: definitions.md
  - Test Plan: test-plan.md
  - Test Cases: test-cases.md
  - Test Scripts: test-scripts.md
  - Evaluation Framework: evaluation-framework.md
  - CTX vs AIFT: ctx-vs-aift.md
  - Results: results.md
extra:
  social:
    - type: github
      link: ''
plugins:
  - search
